<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>System Kasowy POS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; gap: 20px; padding: 20px; }

        /* Lewa kolumna: Skanowanie i lista */
        .left-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Prawa kolumna: Paragon i przyciski */
        .right-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }

        h2 { margin-top: 0; color: #333; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; font-size: 16px; width: 100%; border: 2px solid #ddd; border-radius: 4px; }
        button { padding: 12px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; color: white; transition: 0.2s; }

        .btn-scan { background-color: #007bff; }
        .btn-scan:hover { background-color: #0056b3; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; }

        /* Styl paragonu */
        #receiptOutput {
            background-color: #fffbe6;
            border: 1px dashed #ccc;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap; /* Zachowuje formatowanie tekstu z Javy */
            flex-grow: 1;
            margin-bottom: 20px;
            font-size: 14px;
            min-height: 200px;
        }

        .actions { display: flex; gap: 10px; flex-direction: column; }
        .btn-cash { background-color: #28a745; }
        .btn-card { background-color: #6610f2; }
        .btn-return { background-color: #dc3545; margin-top: 20px; }

    </style>
</head>
<body>

<div class="left-panel">
    <h2>Skaner Produktów</h2>
    <div class="input-group">
        <input type="text" id="barcodeInput" placeholder="Zeskanuj kod (np. 111, 222, 444)..." autofocus>
        <button class="btn-scan" onclick="scanProduct()">SKANUJ</button>
    </div>

    <h3>Koszyk</h3>
    <table>
        <thead>
        <tr>
            <th>Produkt</th>
            <th>Cena</th>
        </tr>
        </thead>
        <tbody id="cartTableBody">
        </tbody>
    </table>

    <div style="margin-top: 30px; border-top: 2px solid #ddd; padding-top: 20px;">
        <h3>Zwrot Towaru</h3>
        <div class="input-group">
            <input type="text" id="returnInput" placeholder="Kod do zwrotu...">
            <button class="btn-return" onclick="returnProduct()">ZWRÓĆ</button>
        </div>
    </div>
</div>

<div class="right-panel">
    <h2>Paragon</h2>
    <div id="receiptOutput">Tu pojawi się paragon po zapłacie...</div>

    <div class="actions">
        <button class="btn-cash" onclick="pay('GOTÓWKA')">ZAPŁAĆ GOTÓWKĄ</button>
        <button class="btn-card" onclick="pay('KARTA')">ZAPŁAĆ KARTĄ</button>
    </div>
</div>

<script>
    const API_URL = '/pos';

    // Obsługa Entera w polu skanowania
    document.getElementById("barcodeInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") scanProduct();
    });

    async function scanProduct() {
        const input = document.getElementById('barcodeInput');
        const barcode = input.value;
        if (!barcode) return;

        // Wywołanie backendu (Java)
        const response = await fetch(`${API_URL}/scan/${barcode}`, { method: 'POST' });

        if (response.ok) {
            input.value = ''; // Wyczyść pole po udanym skanie
            loadCart();       // Odśwież listę
        } else {
            alert("Błąd! Nie znaleziono produktu.");
        }
    }

    async function loadCart() {
        const response = await fetch(`${API_URL}/cart`);
        const products = await response.json();

        const tbody = document.getElementById('cartTableBody');
        tbody.innerHTML = '';

        products.forEach(p => {
            const row = `<tr><td>${p.name}</td><td>${p.price.toFixed(2)} PLN</td></tr>`;
            tbody.innerHTML += row;
        });
    }

    async function pay(method) {
        const response = await fetch(`${API_URL}/pay?method=${method}`, { method: 'POST' });
        const receiptText = await response.text();

        // Wyświetl paragon
        document.getElementById('receiptOutput').textContent = receiptText;
        // Wyczyść koszyk na ekranie
        document.getElementById('cartTableBody').innerHTML = '';
    }

    async function returnProduct() {
        const input = document.getElementById('returnInput');
        const barcode = input.value;
        if (!barcode) return;

        const response = await fetch(`${API_URL}/return/${barcode}`, { method: 'POST' });
        const message = await response.text();
        alert(message);
        input.value = '';
    }
</script>
</body>
</html>
